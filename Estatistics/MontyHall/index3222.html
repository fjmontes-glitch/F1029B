<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Monty Hall</title>
    <!-- Librería para el efecto de serpentinas (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: rgb(26, 66, 110);
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 20px;
            text-align: center;
            transition: background 0.5s, box-shadow 0.5s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Animación de brillo para la victoria */
        .container.winner-bg {
            background: linear-gradient(135deg, #ffffff 0%, #fff3cd 50%, #ffe8a1 100%);
            box-shadow: 0 0 30px #ffc107, 0 0 60px #ff9800;
            animation: pulseGlow 1.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px #ffc107; }
            100% { box-shadow: 0 0 40px #ff9800; }
        }

        .image-container {
            width: 100%;
            max-height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            border-radius: 8px;
            margin-bottom: 20px;
            background-color: #e9ecef;
        }

        .image-container img {
            max-width: 100%;
            max-height: 400px;
            object-fit: contain;
        }

        .doors-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
            order: 10; /* Asegura que las puertas vayan al final */
        }

        .door {
            width: 100px;
            height: 150px;
            background-color: #8b5a2b;
            color: white;
            font-size: 2rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            border: 4px solid #5c3a17;
            transition: transform 0.2s, background-color 0.2s;
            user-select: none;
        }

        .door:hover {
            transform: scale(1.05);
            background-color: #a06832;
        }

        .door.selected {
            border-color: #ffc107;
            box-shadow: 0 0 15px #ffc107;
        }

        .door.disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .door.opened {
            background-color: #d9534f;
            border-color: #ac2925;
        }

        /* Área de controles modificada para el nuevo orden */
        #controls-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .decision-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 15px; /* Espacio antes del texto de la pregunta */
        }

        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin: 5px;
        }

        .btn:hover {
            background-color: #0056b3;
        }

        .btn-success {
            background-color: #28a745;
        }

        .btn-success:hover {
            background-color: #218838;
        }

        .btn-danger {
            background-color: #dc3545;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        .hidden {
            display: none !important;
        }

        #message {
            font-size: 1.2rem;
            margin: 15px 0;
            min-height: 1.5em;
            order: 5; /* Posiciona el mensaje después de los botones */
        }
    </style>
</head>
<body>

<div id="game-card" class="container">
    <!-- 1. Display de la Imagen (Arriba) -->
    <div class="image-container">
        <img id="host-img" src="1.presentador.png" alt="Imagen del Host">
    </div>

    <!-- Contenedor de Botones de Control (Aquí irán los botones intermedios) -->
    <div id="controls-area">
        <!-- Botón inicial -->
        <button id="next-btn" class="btn" onclick="nextStep()">Siguiente</button>
        
        <!-- 2. Botones de decisión (Aparecerán aquí, entre imagen y texto) -->
        <div id="decision-area" class="decision-buttons hidden">
            <button id="change-btn" class="btn btn-success" onclick="confirmChoice(true)">¡Quiero cambiar!</button>
            <button id="keep-btn" class="btn btn-danger" onclick="confirmChoice(false)">Me quedo con mi puerta</button>
        </div>

        <!-- Botón final -->
        <button id="restart-btn" class="btn hidden" onclick="restartGame()">Jugar de nuevo</button>
    </div>

    <!-- 3. Mensajes de texto (Pregunta, etc.) -->
    <div id="message">¡Hola! Soy tu host en este juego de probabilidades.</div>

    <!-- Contenedor de Puertas (Al final) -->
    <div id="doors-area" class="doors-container hidden">
        <div class="door" onclick="selectDoor(0)">1</div>
        <div class="door" onclick="selectDoor(1)">2</div>
        <div class="door" onclick="selectDoor(2)">3</div>
    </div>
</div>

<script>
    // Variables de estado del juego
    let step = 1;
    let autoDoor = -1;
    let selectedDoor = -1;
    let openedDoor = -1;
    let remainingDoor = -1;

    // Elementos del DOM
    const gameCard = document.getElementById('game-card');
    const hostImg = document.getElementById('host-img');
    const message = document.getElementById('message');
    const doorsArea = document.getElementById('doors-area');
    const decisionArea = document.getElementById('decision-area');
    const doors = document.querySelectorAll('.door');
    const nextBtn = document.getElementById('next-btn');
    const restartBtn = document.getElementById('restart-btn');

    // Contexto de audio Web API para sintetizar los sonidos
    let audioCtx = null;

    function getAudioContext() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        return audioCtx;
    }

    // Efecto de sonido: Sad Trombone en Bb -> A -> Ab -> G -> Gb -> F
    function playSadTrombone() {
        const ctx = getAudioContext();
        const baseDuration = 0.35; 
        
        const notes = [
            { freq: 233.08, duration: baseDuration },            // Bb3
            { freq: 220.00, duration: baseDuration },            // A3
            { freq: 207.65, duration: baseDuration },            // Ab3
            { freq: 196.00, duration: baseDuration },            // G3
            { freq: 185.00, duration: baseDuration },            // Gb3
            { freq: 174.61, duration: baseDuration * 3, slide: true } // F3 (Triple duración con caída)
        ];

        let startTime = ctx.currentTime + 0.1;

        notes.forEach((note) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(note.freq, startTime);
            
            if (note.slide) {
                osc.frequency.exponentialRampToValueAtTime(135, startTime + note.duration);
            }

            gain.gain.setValueAtTime(0, startTime);
            gain.gain.linearRampToValueAtTime(0.2, startTime + 0.04); 
            gain.gain.exponentialRampToValueAtTime(0.0001, startTime + note.duration);

            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startTime);
            osc.stop(startTime + note.duration);
            startTime += note.duration + 0.03;
        });
    }

    // Efecto de sonido: Aplausos de victoria
    function playApplause() {
        const ctx = getAudioContext();
        const duration = 3.5;
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1200;
        filter.Q.value = 1.0;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.25, ctx.currentTime + 0.2);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start();
    }

    // Efecto visual: Lluvia de serpentinas
    function triggerConfetti() {
        if (typeof confetti === 'function') {
            const duration = 3 * 1000;
            const end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 } });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            })();
        }
    }

    function nextStep() {
        if (step === 1) {
            hostImg.src = "2.bienvenido al juego.png";
            message.innerText = "Este es el juego de Monty Hall. Hay 3 puertas: detrás de una hay un auto y detrás de las otras dos hay cabras.";
            autoDoor = Math.floor(Math.random() * 3);
            step = 2;
        } else if (step === 2) {
            hostImg.src = "3.elige puerta.png";
            message.innerText = "Por favor, elige una de las 3 puertas haciendo clic en ella.";
            doorsArea.classList.remove('hidden');
            nextBtn.classList.add('hidden');
            step = 3;
        }
    }

    function selectDoor(index) {
        if (step !== 3) return;
        selectedDoor = index;
        
        doors.forEach((door, idx) => {
            if (idx === selectedDoor) { door.classList.add('selected'); }
        });

        let possibleDoorsToOpen = [];
        for (let i = 0; i < 3; i++) {
            if (i !== selectedDoor && i !== autoDoor) { possibleDoorsToOpen.push(i); }
        }
        openedDoor = possibleDoorsToOpen[Math.floor(Math.random() * possibleDoorsToOpen.length)];
        
        for (let i = 0; i < 3; i++) {
            if (i !== selectedDoor && i !== openedDoor) { remainingDoor = i; }
        }

        setTimeout(() => {
            hostImg.src = "4.abro puerta.png";
            doors[openedDoor].classList.add('opened', 'disabled');
            doors[openedDoor].innerText = "🐐";
            message.innerText = `He abierto la puerta ${openedDoor + 1} y hay una cabra.`;
            
            setTimeout(() => { showChangeOption(); }, 5000);
        }, 500);
    }

    function showChangeOption() {
        step = 5;
        hostImg.src = "5.cambias o te quedas.png";
        
        // MODIFICACIÓN: Mostrar botones ANTES de cambiar el texto
        decisionArea.classList.remove('hidden');
        message.innerText = `¿Quieres cambiar a la puerta ${remainingDoor + 1} o prefieres quedarte con la puerta ${selectedDoor + 1}?`;
    }

    function confirmChoice(shouldChange) {
        // Ocultar el área de botones de decisión
        decisionArea.classList.add('hidden');

        if (shouldChange) { selectedDoor = remainingDoor; }
        const wonAuto = (selectedDoor === autoDoor);

        if (wonAuto) {
            hostImg.src = "6a.auto.png";
            message.innerText = "¡Felicidades! ¡Te has ganado el AUTO! 🚗🎉";
            gameCard.classList.add('winner-bg');
            triggerConfetti();
            playApplause();
        } else {
            hostImg.src = "6b.cabra.png";
            message.innerText = "¡Mala suerte! Te has ganado una CABRA 🐐.";
            playSadTrombone();
        }

        doors[selectedDoor].innerText = wonAuto ? "🚗" : "🐐";
        setTimeout(() => { showMoraleja(); }, 7000);
    }

    function showMoraleja() {
        gameCard.classList.remove('winner-bg');
        hostImg.src = "7.moraleja.png";
        message.innerText = "¡No es opinión y no es suerte, es estadística! Siempre es más probable ganar si cambias de puerta.";
        restartBtn.classList.remove('hidden');
    }

    function restartGame() {
        step = 1;
        autoDoor = -1;
        selectedDoor = -1;
        openedDoor = -1;
        remainingDoor = -1;
        gameCard.classList.remove('winner-bg');
        decisionArea.classList.add('hidden'); // Asegurar que estén ocultos
        hostImg.src = "1.presentador.png";
        message.innerText = "¡Hola! Soy tu host en este juego de probabilidades.";
        doors.forEach((door, idx) => {
            door.className = "door";
            door.innerText = idx + 1;
        });
        doorsArea.classList.add('hidden');
        restartBtn.classList.add('hidden');
        nextBtn.classList.remove('hidden');
    }
</script>

</body>
</html>
